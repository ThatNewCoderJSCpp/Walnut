name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(walnut VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs common system libraries
        run: |
          readelf -d build/walnut | grep NEEDED
          if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
            echo "::error::walnut links to a library users may not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Walnut-*.tar.gz -C smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          smoke/Walnut-*/bin/walnut run smoke/ok.wal

      - name: Test the package on a system that only has a C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ > /dev/null
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
            if /smoke/Walnut-*/bin/walnut run /smoke/ok.wal --cxx no-such-compiler 2>&1 | grep -q "cannot find the C++ compiler"; then exit 0; fi
            echo "::error::walnut did not explain a missing C++ compiler"
            exit 1
          '

      - name: Test walnut init on a system with no C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            if /smoke/Walnut-*/bin/walnut init --status; then
              echo "::error::walnut init --status found a compiler on a system without one"
              exit 1
            fi
            DEBIAN_FRONTEND=noninteractive /smoke/Walnut-*/bin/walnut init --yes > /dev/null
            /smoke/Walnut-*/bin/walnut init --status
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-${{ matrix.arch }}
          path: build/Walnut-*.tar.gz
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, check, package and test in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file binutils \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
              -DWALNUT_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            readelf -d build/walnut | grep NEEDED
            if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
              echo "::error::walnut links to a library users may not have"
              exit 1
            fi
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Walnut-*.tar.gz -C smoke
            printf "function main() -> int {\n    return 0;\n} end function main\n" > smoke/ok.wal
            smoke/Walnut-*/bin/walnut run smoke/ok.wal
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-i686
          path: build/Walnut-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            platform: windows-mingw64
            runner: windows-latest
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            platform: windows-ucrt64
            runner: windows-latest
          - msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true

      - name: Install packages
        run: |
          sed -i 's/^#\?ParallelDownloads.*/ParallelDownloads = 2/' /etc/pacman.conf
          packages="git unzip ${{ matrix.prefix }}-cc ${{ matrix.prefix }}-cmake ${{ matrix.prefix }}-ninja ${{ matrix.prefix }}-zlib ${{ matrix.prefix }}-libjpeg-turbo ${{ matrix.prefix }}-vulkan-headers"
          for attempt in 1 2 3 4 5 6; do
            if pacman -S --needed --noconfirm --overwrite '*' $packages; then
              exit 0
            fi
            wait=$((attempt * 30))
            echo "::warning::pacman couldn't download everything (attempt $attempt of 6); the MSYS2 mirrors are probably rate limiting, so trying again in $wait seconds"
            sleep $wait
          done
          echo "::error::pacman still couldn't download the packages after 6 attempts"
          exit 1

      - name: Configure
        run: |
          lib=$(cygpath -m "$MINGW_PREFIX/lib")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs DLLs that come with Windows
        run: |
          objdump -p build/walnut.exe | grep "DLL Name"
          if objdump -p build/walnut.exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
            echo "::error::walnut needs a DLL that users will not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          unzip -q build/Walnut-*.zip -d smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          smoke/Walnut-*/bin/walnut.exe run smoke/ok.wal

      - name: Test walnut init without MSYS2
        shell: pwsh
        run: |
          $walnut = (Get-ChildItem smoke -Directory -Filter "Walnut-*" | Select-Object -First 1).FullName + "\bin\walnut.exe"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:WALNUT_TOOLCHAIN_DIR = "$env:RUNNER_TEMP\walnut-toolchain"
          & $walnut init --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut init --status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut build smoke\ok.wal -o smoke\ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & smoke\ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-${{ matrix.platform }}
          path: build/Walnut-*.zip
          if-no-files-found: error

  publish:
    name: Attach Walnut to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
