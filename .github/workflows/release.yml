name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(walnut VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs common system libraries
        run: |
          readelf -d build/walnut | grep NEEDED
          if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
            echo "::error::walnut links to a library users may not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Walnut-*.tar.gz -C smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          smoke/Walnut-*/bin/walnut run smoke/ok.wal

      - name: Test the package on a system that only has a C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ > /dev/null
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
            if /smoke/Walnut-*/bin/walnut run /smoke/ok.wal --cxx no-such-compiler 2>&1 | grep -q "cannot find the C++ compiler"; then exit 0; fi
            echo "::error::walnut did not explain a missing C++ compiler"
            exit 1
          '

      - name: Test walnut init on a system with no C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            if /smoke/Walnut-*/bin/walnut init --status; then
              echo "::error::walnut init --status found a compiler on a system without one"
              exit 1
            fi
            DEBIAN_FRONTEND=noninteractive /smoke/Walnut-*/bin/walnut init --yes > /dev/null
            /smoke/Walnut-*/bin/walnut init --status
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-${{ matrix.arch }}
          path: build/Walnut-*.tar.gz
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, check, package and test in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file binutils \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
              -DWALNUT_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            readelf -d build/walnut | grep NEEDED
            if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
              echo "::error::walnut links to a library users may not have"
              exit 1
            fi
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Walnut-*.tar.gz -C smoke
            printf "function main() -> int {\n    return 0;\n} end function main\n" > smoke/ok.wal
            smoke/Walnut-*/bin/walnut run smoke/ok.wal
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-i686
          path: build/Walnut-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
            host: x86_64
            wine: true
          - target: i686-w64-mingw32
            platform: windows-i686
            host: i686
            wine: false
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
            host: aarch64
            wine: false
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wineprefix
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip
          if [ "${{ matrix.wine }}" = "true" ]; then sudo apt-get install -y wine64; fi

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ matrix.target }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs DLLs that come with Windows
        run: |
          $LLVM_MINGW_TARGET-objdump -p build/walnut.exe | grep "DLL Name"
          if $LLVM_MINGW_TARGET-objdump -p build/walnut.exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
            echo "::error::walnut needs a DLL that users will not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Download the Windows llvm-mingw to bundle
        run: |
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-${{ matrix.host }}"
          curl -fL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/$name.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip"
          echo "BUNDLE_ZIP=$RUNNER_TEMP/$name.zip" >> "$GITHUB_ENV"
          echo "BUNDLE_URL=https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip" >> "$GITHUB_ENV"

      - name: Make the package that comes with its compiler
        run: bash .github/scripts/bundle-compiler.sh build/Walnut-*-${{ matrix.platform }}.zip "$BUNDLE_ZIP" "$BUNDLE_URL"

      - name: Test the package with its compiler under Wine
        if: matrix.wine
        run: |
          mkdir -p smoke
          unzip -q build/Walnut-*-with-compiler.zip -d smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          walnut=$(ls -d smoke/Walnut-*)/bin/walnut.exe
          wineboot --init || true
          wine "$walnut" init --status
          wine "$walnut" run smoke/ok.wal

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-${{ matrix.platform }}
          path: build/Walnut-*.zip
          compression-level: 0
          if-no-files-found: error

  windows-native:
    name: Run on Windows ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-ucrt64
            runner: windows-latest
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: walnut-${{ matrix.platform }}
          path: packages

      - name: Run a program with the bundled compiler
        run: |
          $zip = Get-ChildItem packages/*-with-compiler.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath bundled
          $walnut = (Get-ChildItem bundled -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          Set-Content ok.wal "function main() -> int {`n    return 0;`n} end function main`n"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & $walnut init --status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut run ok.wal
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test walnut init with the plain package
        run: |
          $zip = Get-ChildItem packages/*.zip | Where-Object { $_.Name -notlike "*-with-compiler.zip" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath plain
          $walnut = (Get-ChildItem plain -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          Set-Content ok.wal "function main() -> int {`n    return 0;`n} end function main`n"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:WALNUT_TOOLCHAIN_DIR = "$env:RUNNER_TEMP\walnut-toolchain"
          & $walnut init --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut build ok.wal -o ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & .\ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    name: Attach Walnut to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, windows, windows-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
