name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(walnut VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config rpm dpkg-dev file unzip \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs common system libraries
        run: |
          readelf -d build/walnut | grep NEEDED
          if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
            echo "::error::walnut links to a library users may not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Walnut-*.tar.gz -C smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          smoke/Walnut-*/bin/walnut run smoke/ok.wal
          cp .github/scripts/audio-smoke.wal smoke/audio.wal
          (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run audio.wal)
          cp .github/scripts/video-smoke.wal smoke/video.wal
          cp .github/scripts/video-smoke.mp4 smoke/video-smoke.mp4
          (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run video.wal)

      - name: Make the .tar.xz, .zip, .deb and .rpm
        run: bash .github/scripts/repackage.sh build/Walnut-*-linux-${{ matrix.arch }}.tar.gz linux-${{ matrix.arch }} "TXZ;ZIP;DEB;RPM"

      - name: Test the .deb
        run: |
          sudo apt-get install -y ./build/Walnut-*-linux-${{ matrix.arch }}.deb
          test -x /opt/walnut/bin/walnut
          test -L /usr/bin/walnut
          walnut run smoke/ok.wal
          sudo apt-get remove -y walnut
          test ! -e /usr/bin/walnut
          test ! -e /opt/walnut/bin/walnut

      - name: Check the .rpm
        run: |
          rpm -qpi build/Walnut-*-linux-${{ matrix.arch }}.rpm
          rpm -qpl build/Walnut-*-linux-${{ matrix.arch }}.rpm | grep -x /opt/walnut/bin/walnut
          rpm -qp --scripts build/Walnut-*-linux-${{ matrix.arch }}.rpm | grep -q "/usr/bin/walnut"

      - name: Test the package on a system that only has a C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ > /dev/null
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
            (cd /tmp && FIZMO_AUDIO_BACKEND=null /smoke/Walnut-*/bin/walnut run /smoke/audio.wal)
            (cp /smoke/video-smoke.mp4 /tmp/ && cd /tmp && FIZMO_AUDIO_BACKEND=null /smoke/Walnut-*/bin/walnut run /smoke/video.wal)
            if /smoke/Walnut-*/bin/walnut run /smoke/ok.wal --cxx no-such-compiler 2>&1 | grep -q "cannot find the C++ compiler"; then exit 0; fi
            echo "::error::walnut did not explain a missing C++ compiler"
            exit 1
          '

      - name: Test walnut init on a system with no C++ compiler
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" ubuntu:22.04 bash -c '
            set -e
            if /smoke/Walnut-*/bin/walnut init --status; then
              echo "::error::walnut init --status found a compiler on a system without one"
              exit 1
            fi
            DEBIAN_FRONTEND=noninteractive /smoke/Walnut-*/bin/walnut init --yes --no-precompile > /dev/null
            /smoke/Walnut-*/bin/walnut init --status
            /smoke/Walnut-*/bin/walnut run /smoke/ok.wal
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-${{ matrix.arch }}
          path: |
            build/Walnut-*.tar.gz
            build/Walnut-*.tar.xz
            build/Walnut-*.zip
            build/Walnut-*.deb
            build/Walnut-*.rpm
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.arch == 'arm64'
        run: |
          brew update
          brew install ninja pkg-config fontconfig freetype harfbuzz openssl@3 jpeg-turbo zlib vulkan-headers
          echo "FIZMO_VULKAN_INC=$(brew --prefix vulkan-headers)/include" >> "$GITHUB_ENV"

      - name: Install dependencies (Intel)
        if: matrix.arch == 'x86_64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew list --versions ninja pkgconf fontconfig freetype harfbuzz openssl@3 jpeg-turbo
          git clone --depth 1 --branch v1.4.363 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "FIZMO_VULKAN_INC=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          prefix=$(brew --prefix)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=macos-${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DFIZMO_VULKAN_INCLUDE_DIR="$FIZMO_VULKAN_INC" \
            -DCMAKE_PREFIX_PATH="$prefix;$(brew --prefix jpeg-turbo);$(brew --prefix zlib)"

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs libraries that come with macOS
        run: |
          otool -L build/walnut
          if otool -L build/walnut | tail -n +2 | grep -vE "^[[:space:]]+(/usr/lib/|/System/Library/)"; then
            echo "::error::walnut links to a library users may not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Walnut-*.tar.gz -C smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          smoke/Walnut-*/bin/walnut init --status
          smoke/Walnut-*/bin/walnut run smoke/ok.wal
          cp .github/scripts/audio-smoke.wal smoke/audio.wal
          (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run audio.wal)
          cp .github/scripts/video-smoke.wal smoke/video.wal
          cp .github/scripts/video-smoke.mp4 smoke/video-smoke.mp4
          (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run video.wal)

      - name: Make the .tar.xz and .zip
        run: bash .github/scripts/repackage.sh build/Walnut-*-macos-${{ matrix.arch }}.tar.gz macos-${{ matrix.arch }} "TXZ;ZIP"

      - name: Test the .zip
        run: |
          mkdir -p smoke-zip
          unzip -q build/Walnut-*-macos-${{ matrix.arch }}.zip -d smoke-zip
          smoke-zip/Walnut-*/bin/walnut run smoke/ok.wal

      - name: Make the .pkg installer and the disk image
        run: bash .github/scripts/macos-installers.sh build/Walnut-*-macos-${{ matrix.arch }}.tar.gz macos-${{ matrix.arch }}

      - name: Install, use and uninstall with the .pkg
        run: |
          pkgutil --payload-files build/Walnut-*-macos-${{ matrix.arch }}.pkg | grep -x "./usr/local/walnut/bin/walnut"
          sudo installer -pkg build/Walnut-*-macos-${{ matrix.arch }}.pkg -target /
          test "$(readlink /usr/local/bin/walnut)" = /usr/local/walnut/bin/walnut
          cp .github/scripts/std-smoke.wal smoke/std.wal
          (cd smoke && /usr/local/bin/walnut run std.wal)
          /usr/local/bin/walnut init --status
          sudo /usr/local/walnut/uninstall.sh
          if [ -e /usr/local/walnut ] || [ -e /usr/local/bin/walnut ]; then
            echo "::error::the uninstaller left Walnut behind"
            exit 1
          fi

      - name: Test the disk image
        run: |
          mount="$RUNNER_TEMP/walnut-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" build/Walnut-*-macos-${{ matrix.arch }}.dmg
          trap 'hdiutil detach "$mount" -force || true' EXIT
          test -f "$mount/Install Walnut.pkg"
          test -f "$mount/Read Me.txt"
          pkgutil --check-signature "$mount/Install Walnut.pkg" || true

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-macos-${{ matrix.arch }}
          path: |
            build/Walnut-*.tar.gz
            build/Walnut-*.tar.xz
            build/Walnut-*.zip
            build/Walnut-*.pkg
            build/Walnut-*.dmg
          compression-level: 0
          if-no-files-found: error

  android:
    name: Android ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build file unzip xz-utils

      - name: Configure
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]; then
            echo "::error::the runner has no Android NDK"
            exit 1
          fi
          echo "NDK=$ndk" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DFIZMO_BUILD_SHARED=OFF -DFIZMO_BUILD_SHADER_TOOL=OFF \
            -DWALNUT_PACKAGE_PLATFORM=android-${{ matrix.arch }}

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut is an Android program that only needs Android's own libraries
        run: |
          readelf="$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          file build/walnut
          file build/walnut | grep -q "interpreter /system/bin/linker"
          "$readelf" -n build/walnut | tee notes.txt
          grep -q "NT_ANDROID_TYPE_IDENT" notes.txt
          "$readelf" -d build/walnut | tee needed.txt
          if grep NEEDED needed.txt | grep -vE "\[(libc|libm|libdl|liblog|libz)\.so\]"; then
            echo "::error::walnut needs a library that Android doesn't have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Check the package
        run: |
          tar -tzf build/Walnut-*-android-${{ matrix.arch }}.tar.gz | grep -E "/bin/walnut$"
          tar -tzf build/Walnut-*-android-${{ matrix.arch }}.tar.gz | grep -E "/fizmo/walnut-kit.txt$"
          tar -tzf build/Walnut-*-android-${{ matrix.arch }}.tar.gz | grep -E "/fizmo/lib/libfizmo_core.a$"

      - name: Make the .tar.xz and .zip
        run: bash .github/scripts/repackage.sh build/Walnut-*-android-${{ matrix.arch }}.tar.gz android-${{ matrix.arch }} "TXZ;ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-android-${{ matrix.arch }}
          path: |
            build/Walnut-*.tar.gz
            build/Walnut-*.tar.xz
            build/Walnut-*.zip
          compression-level: 0
          if-no-files-found: error

  android-termux:
    name: Run in Termux ${{ matrix.arch }}
    needs: android
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: termux/termux-docker:x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            image: termux/termux-docker:aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: walnut-android-${{ matrix.arch }}
          path: packages

      - name: Build and run programs with walnut in Termux
        run: |
          mkdir -p smoke
          tar -xzf packages/Walnut-*-android-${{ matrix.arch }}.tar.gz -C smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          cp .github/scripts/std-smoke.wal smoke/std.wal
          chmod -R a+rwX smoke
          docker run --rm --privileged -v "$PWD/smoke:/smoke" ${{ matrix.image }} /data/data/com.termux/files/usr/bin/bash -c '
            set -e
            export PREFIX=/data/data/com.termux/files/usr HOME=/data/data/com.termux/files/home
            export PATH="$PREFIX/bin:$PATH" TMPDIR="$PREFIX/tmp"
            (yes | pkg install -y clang) > /dev/null 2>&1 || (apt-get update && apt-get install -y clang)
            cp -R /smoke "$HOME/smoke"
            cd "$HOME/smoke"
            walnut=$(ls -d "$HOME"/smoke/Walnut-*)/bin/walnut
            "$walnut" init --status
            "$walnut" run ok.wal
            "$walnut" run std.wal
            echo "walnut works in Termux"
          '

  android-kit:
    name: Android kit
    needs: [android, linux]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: walnut-android-*
          path: android
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: walnut-linux-x86_64
          path: linux

      - name: Make the kit
        run: |
          v=$(sed -n 's/^project(walnut VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          kit="Walnut-$v-android-kit"
          mkdir -p "$kit" unpacked build
          for pair in arm64:arm64-v8a x86_64:x86_64; do
            arch=${pair%%:*}
            abi=${pair#*:}
            mkdir -p "unpacked/$arch"
            tar -xzf "android/Walnut-$v-android-$arch.tar.gz" -C "unpacked/$arch"
            from=$(ls -d unpacked/$arch/Walnut-*)/fizmo
            mkdir -p "$kit/$abi"
            cp -R "$from/lib" "$kit/$abi/lib"
            cp "$from/walnut-kit.txt" "$kit/$abi/"
          done
          cat > "$kit/README.md" <<EOF
          # Walnut $v Android kit

          The libraries Walnut programs link on Android, one folder for each ABI (arm64-v8a and x86_64), built with the Android NDK for Android 7.0 (API 24) and newer. With it, Walnut on Linux, macOS or Windows builds Walnut code for Android with the NDK's compiler:

              walnut build --shared mylib.wal --android arm64-v8a --android-kit $kit --ndk /path/to/android-ndk

          That makes \`libmylib.so\` for an app's \`lib/arm64-v8a\` folder. \`--ndk\` can be left out when ANDROID_NDK_HOME is set, and \`--android-kit\` when WALNUT_ANDROID_KIT is set or this folder is in the Walnut folder as \`android-kit\`. Without \`--shared\`, Walnut builds an Android program that runs with \`adb shell\`.
          EOF
          zip -qr "build/$kit.zip" "$kit"
          echo "KIT=$kit" >> "$GITHUB_ENV"

      - name: Build with the kit
        run: |
          mkdir -p smoke
          tar -xzf linux/Walnut-*-linux-x86_64.tar.gz -C smoke
          walnut=$(ls -d "$PWD"/smoke/Walnut-*)/bin/walnut
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          cp .github/scripts/std-smoke.wal smoke/std.wal
          printf 'import module.collections\n\nfunction doubled(int: n) -> int {\n    std::collections::Stack<int>: s;\n    s.push(n);\n    return s.pop() * 2;\n} end function doubled\n' > smoke/mylib.wal
          (cd smoke && "$walnut" build std.wal -o std-x86_64 --android x86_64 --android-kit "$PWD/../$KIT" --ndk "$ndk")
          (cd smoke && "$walnut" build mylib.wal --shared --android arm64-v8a --android-kit "$PWD/../$KIT" --ndk "$ndk")
          file smoke/std-x86_64 | grep -q "Android"
          file smoke/libmylib.so | grep -q "ARM aarch64"

      - name: Run what the kit built in Termux
        run: |
          chmod -R a+rwX smoke
          docker run --rm --privileged -v "$PWD/smoke:/smoke" termux/termux-docker:x86_64 /data/data/com.termux/files/usr/bin/bash -c '
            set -e
            export PREFIX=/data/data/com.termux/files/usr HOME=/data/data/com.termux/files/home
            export PATH="$PREFIX/bin:$PATH" TMPDIR="$PREFIX/tmp"
            cp /smoke/std-x86_64 "$HOME/std"
            chmod +x "$HOME/std"
            "$HOME/std"
            echo "the Android program built with the kit works"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-android-kit
          path: build/Walnut-*-android-kit.zip
          compression-level: 0
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, check, package and test in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file binutils rpm dpkg-dev unzip xz-utils \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
              -DWALNUT_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            readelf -d build/walnut | grep NEEDED
            if readelf -d build/walnut | grep NEEDED | grep -E "libjpeg|libstdc\+\+|libgcc_s"; then
              echo "::error::walnut links to a library users may not have"
              exit 1
            fi
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Walnut-*.tar.gz -C smoke
            printf "function main() -> int {\n    return 0;\n} end function main\n" > smoke/ok.wal
            smoke/Walnut-*/bin/walnut run smoke/ok.wal
            cp .github/scripts/audio-smoke.wal smoke/audio.wal
            (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run audio.wal)
            cp .github/scripts/video-smoke.wal smoke/video.wal
            cp .github/scripts/video-smoke.mp4 smoke/video-smoke.mp4
            (cd smoke && FIZMO_AUDIO_BACKEND=null Walnut-*/bin/walnut run video.wal)
            bash .github/scripts/repackage.sh build/Walnut-*-linux-i686.tar.gz linux-i686 "TXZ;ZIP;DEB;RPM"
            apt-get install -y ./build/Walnut-*-linux-i686.deb
            test -L /usr/bin/walnut
            walnut run smoke/ok.wal
            apt-get remove -y walnut
            test ! -e /usr/bin/walnut
            rpm -qpl build/Walnut-*-linux-i686.rpm | grep -x /opt/walnut/bin/walnut
          '

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-linux-i686
          path: |
            build/Walnut-*.tar.gz
            build/Walnut-*.tar.xz
            build/Walnut-*.zip
            build/Walnut-*.deb
            build/Walnut-*.rpm
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
            host: x86_64
            wine: true
          - target: i686-w64-mingw32
            platform: windows-i686
            host: i686
            wine: false
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
            host: aarch64
            wine: false
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wineprefix
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip p7zip-full nsis
          if [ "${{ matrix.wine }}" = "true" ]; then sudo apt-get install -y wine64; fi

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 10 --retry-delay 20 --retry-all-errors -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ matrix.target }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DWALNUT_PACKAGE=ON -DWALNUT_BUILD_DEBUG_DRIVER=OFF -DFIZMO_TUNE=OFF \
            -DWALNUT_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        run: cmake --build build -j 4

      - name: Check walnut only needs DLLs that come with Windows
        run: |
          $LLVM_MINGW_TARGET-objdump -p build/walnut.exe | grep "DLL Name"
          if $LLVM_MINGW_TARGET-objdump -p build/walnut.exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
            echo "::error::walnut needs a DLL that users will not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Download the Windows llvm-mingw to bundle
        run: |
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-${{ matrix.host }}"
          curl -fL --retry 10 --retry-delay 20 --retry-all-errors -o "$RUNNER_TEMP/$name.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip"
          echo "BUNDLE_ZIP=$RUNNER_TEMP/$name.zip" >> "$GITHUB_ENV"
          echo "BUNDLE_URL=https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip" >> "$GITHUB_ENV"

      - name: Make the package that comes with its compiler
        run: bash .github/scripts/bundle-compiler.sh build/Walnut-*-${{ matrix.platform }}.zip "$BUNDLE_ZIP" "$BUNDLE_URL"

      - name: Make the .7z file and installer of the plain package
        run: |
          plain=$(ls build/Walnut-*-${{ matrix.platform }}.zip)
          bash .github/scripts/repackage.sh "$plain" ${{ matrix.platform }} "7Z;NSIS"
          ls -l build/Walnut-*

      - name: Test the package with its compiler under Wine
        if: matrix.wine
        run: |
          mkdir -p smoke
          unzip -q build/Walnut-*-with-compiler.zip -d smoke
          printf 'function main() -> int {\n    return 0;\n} end function main\n' > smoke/ok.wal
          walnut=$(realpath "$(ls -d smoke/Walnut-*)/bin/walnut.exe")
          wineboot --init || true
          wine "$walnut" init --status
          wine "$walnut" run smoke/ok.wal
          cp .github/scripts/std-smoke.wal smoke/std.wal
          wine "$walnut" run smoke/std.wal
          cp .github/scripts/audio-smoke.wal smoke/audio.wal
          (cd smoke && FIZMO_AUDIO_BACKEND=null wine "$walnut" run audio.wal)
          cp .github/scripts/video-smoke.wal smoke/video.wal
          cp .github/scripts/video-smoke.mp4 smoke/video-smoke.mp4
          (cd smoke && FIZMO_AUDIO_BACKEND=null wine "$walnut" run video.wal)

      - uses: actions/upload-artifact@v4
        with:
          name: stage-windows-${{ matrix.platform }}
          path: |
            build/Walnut-*.zip
            build/Walnut-*.7z
            build/Walnut-*.exe
          compression-level: 0
          if-no-files-found: error

  windows-std:
    name: Precompile the std library on Windows ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-ucrt64
            runner: windows-latest
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage-windows-${{ matrix.platform }}
          path: packages

      - name: Precompile the standard library with the bundled compiler
        run: |
          $zip = Get-ChildItem packages/*-with-compiler.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath bundled
          $walnut = (Get-ChildItem bundled -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:WALNUT_CACHE_DIR = "$env:RUNNER_TEMP\walnut-cache"
          & $walnut library --precompile --into std-prebuilt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-ChildItem std-prebuilt -Recurse -Filter objects.txt).Count

      - uses: actions/upload-artifact@v4
        with:
          name: stage-std-${{ matrix.platform }}
          path: std-prebuilt
          if-no-files-found: error

  windows-package:
    name: Package Windows ${{ matrix.platform }} with its std library
    needs: [windows, windows-std]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-ucrt64, windows-i686, windows-clangarm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip p7zip-full nsis

      - uses: actions/download-artifact@v4
        with:
          name: stage-windows-${{ matrix.platform }}
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: stage-std-${{ matrix.platform }}
          path: std-prebuilt

      - name: Put the precompiled std library in the package that comes with its compiler
        run: |
          bundled=$(ls build/Walnut-*-${{ matrix.platform }}-with-compiler.zip)
          bash .github/scripts/add-std-prebuilt.sh "$bundled" std-prebuilt
          bash .github/scripts/repackage.sh "$bundled" ${{ matrix.platform }} "7Z;NSIS" -with-compiler
          ls -l build/Walnut-*

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-${{ matrix.platform }}
          path: |
            build/Walnut-*.zip
            build/Walnut-*.7z
            build/Walnut-*.exe
          compression-level: 0
          if-no-files-found: error

  windows-native:
    name: Run on Windows ${{ matrix.platform }}
    needs: windows-package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-ucrt64
            runner: windows-latest
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: walnut-${{ matrix.platform }}
          path: packages

      - name: Run a program with the bundled compiler
        run: |
          $zip = Get-ChildItem packages/*-with-compiler.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath bundled
          $walnut = (Get-ChildItem bundled -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          Set-Content ok.wal "function main() -> int {`n    return 0;`n} end function main`n"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & $walnut init --status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut run ok.wal
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check programs use the std library that comes precompiled
        run: |
          $walnut = (Get-ChildItem bundled -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          $root = Split-Path (Split-Path $walnut)
          if (-not (Test-Path "$root\std-prebuilt")) { Write-Error "the package has no std-prebuilt folder"; exit 1 }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:WALNUT_CACHE_DIR = "$env:RUNNER_TEMP\fresh-cache"
          Copy-Item .github/scripts/std-smoke.wal std-smoke.wal
          & $walnut run std-smoke.wal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Test-Path "$env:WALNUT_CACHE_DIR\std") -and (Get-ChildItem "$env:WALNUT_CACHE_DIR\std" -Recurse -Filter *.o)) {
            Get-ChildItem "$env:WALNUT_CACHE_DIR\std" -Directory | ForEach-Object { "compiled again: $($_.Name) (shipped: $(Test-Path "$root\std-prebuilt\$($_.Name)"))" }
            Write-Error "walnut compiled the std library again instead of using the precompiled one"
            exit 1
          }

      - name: Test walnut init with the plain package
        run: |
          $zip = Get-ChildItem packages/*.zip | Where-Object { $_.Name -notlike "*-with-compiler.zip" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath plain
          $walnut = (Get-ChildItem plain -Directory | Select-Object -First 1).FullName + "\bin\walnut.exe"
          Set-Content ok.wal "function main() -> int {`n    return 0;`n} end function main`n"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:WALNUT_TOOLCHAIN_DIR = "$env:RUNNER_TEMP\walnut-toolchain"
          & $walnut init --yes --no-precompile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $walnut build ok.wal -o ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & .\ok-init.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install and uninstall with the installer that comes with its compiler
        run: |
          $exe = Get-ChildItem packages/Walnut-*-with-compiler.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\WalnutInstall"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\bin\walnut.exe")) { Write-Error "the installer didn't put walnut.exe in $dir\bin"; exit 1 }
          if (-not (Test-Path "$dir\toolchain\walnut-toolchain.txt")) { Write-Error "the installer didn't put the compiler in $dir\toolchain"; exit 1 }
          if (-not (Test-Path "$dir\std-prebuilt")) { Write-Error "the installer didn't put the precompiled std library in $dir\std-prebuilt"; exit 1 }
          Set-Content ok.wal "function main() -> int {`n    return 0;`n} end function main`n"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & "$dir\bin\walnut.exe" run ok.wal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path "$dir\bin\walnut.exe") { Write-Error "the uninstaller left walnut.exe behind"; exit 1 }

      - name: Check the plain installer and .7z files are there
        run: |
          $plain = Get-ChildItem packages/Walnut-*.exe | Where-Object { $_.Name -notlike "*-with-compiler.exe" }
          if (-not $plain) { Write-Error "there's no plain installer"; exit 1 }
          if ((Get-ChildItem packages/Walnut-*.7z).Count -ne 2) { Write-Error "there should be two .7z files"; exit 1 }

  publish:
    name: Attach Walnut to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, macos, windows-package, windows-native, android, android-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: walnut-*
          merge-multiple: true

      - name: Write the release notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          link() { if [ -f "packages/$1" ]; then printf '[%s](%s/%s)' "$2" "$base" "$1"; else printf '%s' "-"; fi; }
          {
            echo "## Downloads"
            echo
            echo "Pick the line for your system. Every archive has the same contents; [the README](https://github.com/${GITHUB_REPOSITORY}#installing) explains each one and how to set up a compiler with \`walnut init\`."
            echo
            echo "| System | Archive | Other formats |"
            echo "|---|---|---|"
            for a in x86_64 arm64 i686; do
              if [ -f packages/Walnut-$v-linux-$a.tar.gz ]; then echo "| Linux $a | $(link "Walnut-$v-linux-$a.tar.gz" .tar.gz) | $(link "Walnut-$v-linux-$a.deb" .deb) · $(link "Walnut-$v-linux-$a.rpm" .rpm) · $(link "Walnut-$v-linux-$a.tar.xz" .tar.xz) · $(link "Walnut-$v-linux-$a.zip" .zip) |"; fi
            done
            for a in arm64 x86_64; do
              if [ -f packages/Walnut-$v-macos-$a.tar.gz ]; then echo "| macOS $a | $(link "Walnut-$v-macos-$a.tar.gz" .tar.gz) | $(link "Walnut-$v-macos-$a.pkg" "installer (.pkg)") · $(link "Walnut-$v-macos-$a.dmg" .dmg) · $(link "Walnut-$v-macos-$a.tar.xz" .tar.xz) · $(link "Walnut-$v-macos-$a.zip" .zip) |"; fi
            done
            for p in ucrt64 i686 clangarm64; do
              case $p in ucrt64) name="Windows x86_64";; i686) name="Windows 32-bit";; clangarm64) name="Windows ARM64";; esac
              if [ -f packages/Walnut-$v-windows-$p.zip ]; then echo "| $name | $(link "Walnut-$v-windows-$p.zip" .zip) | $(link "Walnut-$v-windows-$p.exe" "installer") · $(link "Walnut-$v-windows-$p.7z" .7z) |"; fi
              if [ -f packages/Walnut-$v-windows-$p-with-compiler.zip ]; then echo "| $name, with its C++ compiler | $(link "Walnut-$v-windows-$p-with-compiler.zip" .zip) | $(link "Walnut-$v-windows-$p-with-compiler.exe" "installer") · $(link "Walnut-$v-windows-$p-with-compiler.7z" .7z) |"; fi
            done
            for a in arm64 x86_64; do
              if [ -f packages/Walnut-$v-android-$a.tar.gz ]; then echo "| Android $a, in Termux | $(link "Walnut-$v-android-$a.tar.gz" .tar.gz) | $(link "Walnut-$v-android-$a.tar.xz" .tar.xz) · $(link "Walnut-$v-android-$a.zip" .zip) |"; fi
            done
            if [ -f packages/Walnut-$v-android-kit.zip ]; then echo "| Building for Android from a computer | $(link "Walnut-$v-android-kit.zip" "Android kit (.zip)") | |"; fi
            echo
            echo "macOS: Apple silicon Macs (M1 and newer) use arm64, Intel Macs use x86_64. If macOS refuses to open \`walnut\` or the installer, right-click it and choose Open, or run \`xattr -dr com.apple.quarantine\` on the extracted folder."
            echo
            echo "Windows: the \`with its C++ compiler\` downloads also come with the standard library already compiled, so they work offline and even the first program builds quickly. With the others, \`walnut init\` downloads the compiler and precompiles the standard library once. On Linux, macOS and Android, \`walnut init\` sets up a compiler and precompiles the standard library for it too."
            echo
            echo "Android: the Termux downloads run Walnut on the phone itself, in [Termux](https://termux.dev); \`walnut init\` installs Clang there. The Android kit lets Walnut on Linux, macOS or Windows build Walnut code for Android apps with the Android NDK (\`walnut build --shared app.wal --android arm64-v8a\`)."
          } > release-notes.md
          cat release-notes.md

      - name: List the packages
        run: |
          ls -l packages
          if ! ls packages/Walnut-*-android-*.tar.gz > /dev/null 2>&1; then
            echo "::warning::the Android builds failed, so this release has no Termux packages"
          fi
          if ! ls packages/Walnut-*-android-kit.zip > /dev/null 2>&1; then
            echo "::warning::this release has no Android kit"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
